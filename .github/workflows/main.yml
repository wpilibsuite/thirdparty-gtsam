name: CI

on: [pull_request, push]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: "Validation"
    runs-on: ${{ case(github.repository_owner == 'wpilibsuite', 'blacksmith-2vcpu-ubuntu-2404', 'ubuntu-24.04') }}
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
  build-docker:
    strategy:
      fail-fast: false
      matrix:
        include:
          - container: wpilib/systemcore-cross-debian:trixie
            artifact-name: SystemCore
            build-options: -Pplatform=linux-systemcore -Ptoolchain=/usr/local/toolchain-config.cmake
          - container: wpilib/aarch64-cross-debian:trixie
            artifact-name: Arm64
            build-options: -Pplatform=linux-arm64 -Ptoolchain=/usr/local/toolchain-config.cmake
          - container: wpilib/debian-base:trixie
            artifact-name: Linux
            build-options: -Pplatform=linux-x86_64

    name: "Build - ${{ matrix.artifact-name }}"
    runs-on: ${{ case(github.repository_owner == 'wpilibsuite', 'blacksmith-32vcpu-ubuntu-2404', 'ubuntu-24.04') }}
    needs: [validation]
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: 'temurin'
      - name: Install Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ninja-build build-essential
      - name: Build with Gradle
        run: ./gradlew publish ${{ matrix.build-options }}
        env:
          SCCACHE_WEBDAV_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
          SCCACHE_WEBDAV_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: gradleDir/outputs/

  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact-name: WinArm64
            tool-arch: amd64_arm64
            build-options: -Pplatform=windows-arm64
          - artifact-name: Win64
            tool-arch: x64
            build-options: -Pplatform=windows-x86_64

    name: "Build - ${{ matrix.artifact-name }}"
    runs-on: ${{ case(github.repository_owner == 'wpilibsuite', 'blacksmith-32vcpu-windows-2025', 'windows-2025') }}
    needs: [validation]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
      - uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: 'temurin'
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.tool-arch }}
      - name: Build with Gradle
        run: ./gradlew publish ${{ matrix.build-options }}
        env:
          SCCACHE_WEBDAV_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
          SCCACHE_WEBDAV_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: gradleDir/outputs/

  build-mac:
    name: "Build - macOS"
    runs-on: ${{ case(github.repository_owner == 'wpilibsuite', 'blacksmith-12vcpu-macos-15', 'macOS-15') }}
    needs: [validation]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
      - uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: 'temurin'
      - name: Build with Gradle
        run: ./gradlew publish -Pplatform=osx-universal
        env:
          SCCACHE_WEBDAV_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
          SCCACHE_WEBDAV_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
      - uses: actions/upload-artifact@v7
        with:
          name: macOS
          path: gradleDir/outputs/

  combine:
    name: Combine
    needs: [build-docker, build-windows, build-mac]
    runs-on: ${{ case(github.repository_owner == 'wpilibsuite', 'blacksmith-4vcpu-ubuntu-2404', 'ubuntu-24.04') }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: wpilibsuite/build-tools
      - uses: actions/download-artifact@v8
        with:
          path: combiner/products/build/allOutputs
      - name: Flatten Artifacts
        run: rsync -a --delete combiner/products/build/allOutputs/*/* combiner/products/build/allOutputs/
      - name: Combine
        if: |
          github.repository_owner == 'wpilibsuite' &&
          !startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew publish -Pthirdparty
        working-directory: combiner
      - name: Combine (Release)
        if: |
          github.repository_owner == 'wpilibsuite' &&
          startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew publish -Pthirdparty
        env:
          RUN_AZURE_ARTIFACTORY_RELEASE: 'TRUE'
          ARTIFACTORY_PUBLISH_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
          ARTIFACTORY_PUBLISH_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
        working-directory: combiner
      - uses: actions/upload-artifact@v7
        with:
          name: Maven
          path: ~/releases
